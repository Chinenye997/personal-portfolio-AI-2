<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi.dev | Personal Portfolio</title>

    <!-- Tailwind CSS -->
    <link href="../css/output.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-white text-gray-800">
    <!-- ==========================
         HEADER / NAVIGATION
    =========================== -->

    <!-- <header class="sticky top-0 z-50 bg-white dark:bg-gray-800 shadow-md"> -->
    <header class="sticky top-0 z-50 bg-white shadow-md">
      <nav
        class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4"
      >
        <!-- Logo -->
        <a href="index.html" class="flex items-center gap-3">
          <div
            class="brand-bg w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg"
          >
            C
          </div>

          <div>
            <h2 class="text-xl font-bold text-slate-900">
              Chi<span class="brand-text">.dev</span>
            </h2>

            <p class="text-xs text-slate-500 -mt-1">Full-Stack Developer</p>
          </div>
        </a>

        <!-- Desktop Navigation -->
        <ul class="hidden md:flex items-center gap-8">
          <li>
            <a href="index.html" class="active-link transition"> Home </a>
          </li>

          <li>
            <a href="pages/about.html" class="brand-hover transition">
              About
            </a>
          </li>

          <li>
            <a href="pages/projects.html" class="brand-hover transition">
              Projects
            </a>
          </li>

          <li>
            <a href="pages/resume.html" class="brand-hover transition">
              Resume
            </a>
          </li>

          <li>
            <a href="pages/contact.html" class="brand-hover transition">
              Contact
            </a>
          </li>
        </ul>

        <!-- Right Side Buttons -->
        <div class="flex items-center gap-4">
          <!-- Theme Toggle Button -->
          <button
            id="theme-toggle"
            class="text-xl cursor-pointer brand-hover transition"
            aria-label="Toggle Dark Mode"
          >
            <i class="fa-solid fa-moon"></i>
          </button>

          <!-- Mobile Menu Button -->
          <button
            id="menu-btn"
            class="text-2xl cursor-pointer md:hidden brand-hover transition"
            aria-label="Open Menu"
          >
            <i id="menu-icon" class="fa-solid fa-bars"></i>
          </button>
        </div>
      </nav>

      <!-- Mobile Navigation -->
      <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md">
        <ul class="flex flex-col p-6 space-y-4">
          <li>
            <a href="index.html" class="active-link transition"> Home </a>
          </li>

          <li>
            <a href="pages/about.html" class="brand-hover transition">
              About
            </a>
          </li>

          <li>
            <a href="pages/projects.html" class="brand-hover transition">
              Projects
            </a>
          </li>

          <li>
            <a href="pages/resume.html" class="brand-hover transition">
              Resume
            </a>
          </li>

          <li>
            <a href="pages/contact.html" class="brand-hover transition">
              Contact
            </a>
          </li>
        </ul>
      </div>
    </header>

    <script src="../js/app.js"></script>
  </body>
</html>
